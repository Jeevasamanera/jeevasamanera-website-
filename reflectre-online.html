<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    background: #000;

    color: #fff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    overflow-x: hidden;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {

    height: 60px;

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

    background: #000;

    border-bottom: 1px solid #222;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 3px;
}

.topbar a {

    color: #fff;

    text-decoration: none;
}


/* =====================================================
   BOOK CONTAINER
===================================================== */

.book-area {

    min-height:
        calc(100vh - 130px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px 20px;
}


/* =====================================================
   FIXED BOOK
===================================================== */

.book {

    position: relative;

    width: min(900px, 90vw);

    aspect-ratio: 1.5 / 1;

    background: #000;

    box-shadow:
        0 30px 70px
        rgba(0,0,0,0.8);

    overflow: hidden;
}


/* =====================================================
   OPEN BOOK PAGES
===================================================== */

.pages {

    position: absolute;

    inset: 0;

    display: flex;

    background: #000;

    opacity: 0;

    transition: opacity .25s ease;
}


/* pages appear after opening */

.book.open .pages {

    opacity: 1;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    position: relative;

    width: 50%;

    height: 100%;

    background: #000;

    color: #fff;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 45px;
}


/* =====================================================
   CENTRE SPINE
===================================================== */

.page.left {

    border-right:
        1px solid #222;
}

.page.right {

    border-left:
        1px solid #222;
}


/* =====================================================
   PAGE CONTENT
===================================================== */

.page-content {

    width: 100%;

    max-width: 340px;
}

.label {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 5px;

    color: #666;

    margin-bottom: 25px;
}

.page h2 {

    font-size: 30px;

    font-weight: normal;

    letter-spacing: 4px;

    margin-bottom: 30px;
}

.page p {

    font-size: 15px;

    line-height: 2;

    color: #ccc;
}


/* =====================================================
   PAGE NUMBERS
===================================================== */

.page-number {

    position: absolute;

    bottom: 18px;

    left: 50%;

    transform:
        translateX(-50%);

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    color: #444;
}


/* =====================================================
   CLOSED COVER
===================================================== */

.cover {

    position: absolute;

    z-index: 100;

    left: 25%;

    top: 0;

    width: 50%;

    height: 100%;

    background: #000;

    overflow: hidden;

    cursor: pointer;

    transform-origin: left center;

    transition:
        transform
        1.25s
        cubic-bezier(.65,.05,.36,1);
}


/* cover image */

.cover img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;
}


/* =====================================================
   OPENING COVER
===================================================== */

.book.open .cover {

    transform:
        rotateY(-180deg);
}


/* =====================================================
   CENTRE HINGE
===================================================== */

.hinge {

    position: absolute;

    z-index: 110;

    top: 0;

    left: 50%;

    width: 1px;

    height: 100%;

    background: #222;

    pointer-events: none;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    border-top:
        1px solid #222;
}
