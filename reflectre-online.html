<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REFLECTRE — Online Edition</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #000;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    overflow-x: hidden;
}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.topbar {
    height: 60px;
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: #000;

    border-bottom: 1px solid #222;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
}

.topbar a {
    color: #fff;
    text-decoration: none;
}

.topbar a:hover {
    opacity: 0.6;
}


/* =====================================================
   BOOK AREA
===================================================== */

.book-area {

    min-height: calc(100vh - 130px);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 50px 20px;
}


/* =====================================================
   CLOSED BOOK
===================================================== */

.closed-book {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transition:
        opacity 0.5s ease,
        transform 0.5s ease;
}

.closed-book.hidden {

    display: none;
}


/* =====================================================
   COVER IMAGE
===================================================== */

.cover {

    width: min(420px, 78vw);

    aspect-ratio: 0.707 / 1;

    background: #000;

    overflow: hidden;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.85);

    cursor: pointer;
}

.cover img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;
}


/* =====================================================
   OPEN BOOK
===================================================== */

.open-book {

    display: none;

    width: min(1000px, 92vw);

    aspect-ratio: 1.5 / 1;

    position: relative;

    background: #000;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.8);

    animation:
        bookAppear 0.7s ease forwards;
}

.open-book.visible {

    display: flex;
}


@keyframes bookAppear {

    from {
        opacity: 0;
        transform: scale(0.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   PAGES
===================================================== */

.page {

    width: 50%;

    height: 100%;

    position: relative;

    background: #000;

    color: #fff;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 55px;
}


/* LEFT PAGE */

.left-page {

    border-right: 1px solid #222;
}


/* RIGHT PAGE */

.right-page {

    border-left: 1px solid #222;
}


/* =====================================================
   PAGE CONTENT
===================================================== */

.page-content {

    width: 100%;

    max-width: 360px;
}

.section-label {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 5px;

    color: #666;

    margin-bottom: 25px;
}

.page h1 {

    font-size: 32px;

    font-weight: normal;

    letter-spacing: 5px;

    margin-bottom: 30px;
}

.page p {

    color: #ccc;

    font-size: 15px;

    line-height: 2;
}


/* =====================================================
   PAGE NUMBERS
===================================================== */

.page-number {

    position: absolute;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    color: #444;
}


/* =====================================================
   CENTRE SPINE
===================================================== */

.spine {

    position: absolute;

    top: 0;

    left: 50%;

    width: 1px;

    height: 100%;

    background: #333;

    transform: translateX(-50%);

    z-index: 10;
}

   OPEN BUTTON
