<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>REFLECTRE — Online Edition</title>

<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #000;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    overflow-x: hidden;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    height: 60px;
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    border-bottom: 1px solid #222;

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
}

.topbar a {
    color: #fff;
    text-decoration: none;
}

.topbar a:hover {
    opacity: 0.6;
}


/* =====================================================
   MAIN BOOK AREA
===================================================== */

.book-area {

    min-height: calc(100vh - 130px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 50px 20px;
}


/* =====================================================
   BOOK STAGE
===================================================== */
.book-stage {

    position: relative;

    width: min(900px, 90vw);

    height: min(760px, 78vh);

    min-height: 560px;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =====================================================
   CLOSED COVER
===================================================== */

.closed-cover {

    position: absolute;

    z-index: 20;

    width: min(380px, 70%);

    height: min(540px, 90%);

    max-height: 540px;

    aspect-ratio: 0.707 / 1;

    background: #000;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.85);

    transition:
        transform 1.1s ease,
        opacity 0.7s ease;
}

.closed-cover img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =====================================================
   OPEN BOOK
===================================================== */

.book {

    position: absolute;

    width: 100%;
    height: 100%;

    display: flex;

    opacity: 0;

    visibility: hidden;

    transform: scale(0.96);

    transition:
        opacity 0.7s ease,
        transform 0.7s ease,
        visibility 0s linear 0.7s;
}

.book.open {

    opacity: 1;

    visibility: visible;

    transform: scale(1);

    transition:
        opacity 0.7s ease,
        transform 0.7s ease,
        visibility 0s;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    position: relative;

    width: 50%;
    height: 100%;

    background: #000;

    border-top: 1px solid #222;
    border-bottom: 1px solid #222;

    display: flex;

    align-items: flex-start;
    justify-content: flex-start;
}


/* LEFT PAGE */

.left-page {

    border-left: 1px solid #222;
    border-right: 1px solid #222;
}


/* RIGHT PAGE */

.right-page {

    border-right: 1px solid #222;
}


/* =====================================================
   PAGE CONTENT
========================================================
.page-content {

    width: 100%;

    padding: 85px 70px 80px 70px;
}

/* Small heading */

.section-label {

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 5px;

    color: #666;

    margin-bottom: 28px;
}


/* Main heading */

.page h1 {

    font-size: 34px;

    font-weight: normal;

    letter-spacing: 5px;

    margin-bottom: 35px;
}


/* Text */

.page p {

    max-width: 390px;

    color: #ccc;

    font-size: 16px;

    line-height: 2.05;

    margin-bottom: 26px;
}


/* =====================================================
   PAGE NUMBER
===================================================== */

.page-number {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    font-family: Arial, sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    color: #555;
}


/* =====================================================
   CENTRE SPINE
===================================================== */

.spine {

    position: absolute;

    z-index: 10;

    top: 0;

    left: 50%;

    width: 1px;

    height: 100%;

    background: #333;

    transform: translateX(-50%);
}


/* =====================================================
   OPEN BUTTON
===================================================== */

.open-button {

    position: absolute;

    z-index: 30;

    bottom: -55px;

    left: 50%;

    transform: translateX(-50%);

    padding: 15px 36px;

    background: #000;

    color: #fff;

    border: 1px solid #555;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 3px;

    cursor: pointer;

    white-space: nowrap;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}

.open-button:hover {

    background: #fff;

    color: #000;
}


/* =====================================================
   WHEN BOOK IS OPEN
===================================================== */

.book-stage.is-open .closed-cover {

    opacity: 0;

    transform:
        scale(0.96)
        translateY(-10px);

    pointer-events: none;
}

.book-stage.is-open .open-button {

    display: none;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    border-top: 1px solid #222;
}

.control-button {

    padding: 12px 24px;

    background: transparent;

    color: #fff;

    border: 1px solid #444;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 2px;

    cursor: pointer;

    transition: 0.3s;
}

.control-button:hover {

    background: #fff;

    color: #000;
}

.control-button:disabled {

    opacity: 0.25;

    cursor: default;
}

.page-status {

    min-width: 70px;

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    color: #555;
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 800px) {

    .book-stage {

        width: 94vw;

        height: 63vw;

        min-height: 360px;
    }

    .page-content {

        padding: 50px 40px;
    }

    .page h1 {

        font-size: 28px;
    }

    .page p {

        font-size: 14px;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .topbar {
        height: 55px;

        padding: 0 14px;

        font-size: 8px;

        letter-spacing: 2px;
    }

    .book-area {

        min-height: calc(100vh - 125px);

        padding: 25px 12px 70px;

        align-items: center;
    }


    /* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .topbar {
        height: 55px;
        padding: 0 14px;
        font-size: 8px;
        letter-spacing: 2px;
    }

    .book-area {
        min-height: calc(100vh - 125px);
        padding: 20px 12px 70px;
    }

    /* MOBILE BOOK */

    .book-stage {
        width: 92vw;

        height: calc(100vh - 190px);

        min-height: 520px;
        max-height: 720px;
    }

    /* CLOSED COVER */

    .closed-cover {
        width: min(76vw, 360px);
        height: auto;
        aspect-ratio: 0.707 / 1;
    }

    /* OPEN BOOK */

    .book {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* SINGLE READING PAGE */

    .page {
        width: 100%;
        height: 100%;
        border: 1px solid #222;
    }

    .left-page {
        display: none;
    }

    .right-page {
        width: 100%;
        height: 100%;
        border: 1px solid #222;
    }

    /* READING CONTENT */

    .page-content {
        padding: 55px 32px 70px;
    }

    .section-label {
        font-size: 8px;
        letter-spacing: 4px;
        margin-bottom: 24px;
    }

    .page h1 {
        font-size: 28px;
        letter-spacing: 4px;
        margin-bottom: 30px;
    }

    .page p {
        max-width: none;
        font-size: 15px;
        line-height: 2;
        margin-bottom: 24px;
    }

    .page-number {
        bottom: 20px;
    }

    .spine {
        display: none;
    }

    .open-button {
        bottom: -55px;
        padding: 15px 30px;
    }

}


/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    .book-stage {
        width: 93vw;
        height: calc(100vh - 180px);
        min-height: 500px;
        max-height: 680px;
    }

    .page-content {
        padding: 48px 26px 65px;
    }

    .page h1 {
        font-size: 25px;
    }

    .page p {
        font-size: 14px;
        line-height: 1.9;
    }

}

<!-- =====================================================
     TOP NAVIGATION
===================================================== -->

<header class="topbar">

    <a href="reflectre.html">
        ← BACK
    </a>

    <span>
        REFLECTRE · ONLINE EDITION
    </span>

</header>



<!-- =====================================================
     BOOK
===================================================== -->

<main class="book-area">

<div
    class="book-stage"
    id="bookStage">


    <!-- =================================================
         CLOSED COVER
    ================================================= -->

    <div class="closed-cover">

        <img
            src="Reflectre%20monochrome%20cover.png"
            alt="REFLECTRE">

    </div>



    <!-- =================================================
         OPEN BOOK
    ================================================= -->

    <div
        class="book"
        id="book">


        <!-- LEFT / BLANK PAGE -->

        <section class="page left-page">

            <div class="page-number">
                02
            </div>

        </section>



        <!-- RIGHT / INTRODUCTION PAGE -->

        <section class="page right-page">

            <div class="page-content">

                <div class="section-label">
                    INTRODUCTION
                </div>

                <h1>
                    REFLECTRE
                </h1>

                <p>
                    REFLECTRE is an ongoing exploration
                    of consciousness, perception and the
                    relationship between the inner and
                    outer worlds.
                </p>

                <p>
                    Through charcoal, portraiture,
                    symbolism and atmospheric imagery,
                    the series investigates memory,
                    vulnerability, transformation and
                    spiritual experience.
                </p>

            </div>

            <div class="page-number">
                03
            </div>

        </section>



        <!-- CENTRE SPINE -->

        <div class="spine"></div>


    </div>



    <!-- =================================================
         OPEN BUTTON
    ================================================= -->

    <button
        class="open-button"
        onclick="openReflectre()">

        OPEN REFLECTRE

    </button>


</div>

</main>



<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <button
        class="control-button"
        id="previousButton"
        onclick="closeReflectre()"
        disabled>

        ← PREVIOUS

    </button>


    <div
        class="page-status"
        id="pageStatus">

        COVER

    </div>


    <button
        class="control-button"
        id="nextButton"
        onclick="openReflectre()">

        OPEN BOOK →

    </button>

</div>



<script>

/* =====================================================
   OPEN REFLECTRE
===================================================== */

function openReflectre() {

    const stage =
        document.getElementById("bookStage");

    const book =
        document.getElementById("book");

    stage.classList.add("is-open");

    book.classList.add("open");

    document
        .getElementById("previousButton")
        .disabled = false;

    document
        .getElementById("nextButton")
        .textContent = "NEXT →";

    document
        .getElementById("pageStatus")
        .textContent = "02–03";
}


/* =====================================================
   CLOSE REFLECTRE
===================================================== */

function closeReflectre() {

    const stage =
        document.getElementById("bookStage");

    const book =
        document.getElementById("book");

    stage.classList.remove("is-open");

    book.classList.remove("open");

    document
        .getElementById("previousButton")
        .disabled = true;

    document
        .getElementById("nextButton")
        .textContent = "OPEN BOOK →";

    document
        .getElementById("pageStatus")
        .textContent = "COVER";
}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowRight") {
            openReflectre();
        }

        if (event.key === "ArrowLeft") {
            closeReflectre();
        }

    }
);

</script>


</body>

</html>
