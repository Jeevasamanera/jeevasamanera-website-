<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REFLECTRE — Jeeva Samanera</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #111;
    color: #eee;
    font-family: Georgia, serif;
}


/* NAVIGATION */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    height: 60px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 25px;

    background: rgba(0,0,0,0.75);

    z-index: 10;
}

nav a {
    color: white;
    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 3px;
}


/* COVER */

.cover {
    height: 100vh;

    position: relative;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    overflow: hidden;

    background: black;
}

.cover img {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.cover-overlay {
    position: relative;

    width: 100%;

    padding: 80px 20px 60px;

    text-align: center;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,0.9)
        );
}

.cover h1 {
    font-size: clamp(45px, 9vw, 100px);

    font-weight: normal;

    letter-spacing: 12px;
}

.cover p {
    margin-top: 15px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 5px;
}


/* EDITIONS */

.editions {

    min-height: 35vh;

    padding: 50px 25px 100px;

    display: flex;

    justify-content: center;

    align-items: center;
}

.edition-options {

    width: min(600px, 90vw);

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 40px;
}

.edition-option {

    padding: 25px;

    border: 1px solid #444;

    color: #eee;

    text-decoration: none;

    text-align: center;

    display: flex;

    flex-direction: column;

    gap: 15px;

    transition: 0.3s ease;
}

.edition-option:hover {

    border-color: #aaa;

}

.edition-option span {

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 4px;

}

.edition-option strong {

    font-family: Georgia, serif;

    font-size: 18px;

    font-weight: normal;

}

@media (max-width: 600px) {

    .edition-options {

        grid-template-columns: 1fr;

        gap: 15px;

    }

}


/* CARDS */

.cards {

    width: min(850px, 100%);

    margin-top: 60px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 25px;
}

.card {

    min-height: 300px;

    border: 1px solid #444;

    padding: 45px 30px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;
}

.card small {

    font-family: Arial, sans-serif;

    letter-spacing: 4px;

    color: #888;
}

.card h3 {

    margin-top: 20px;

    font-size: 30px;

    font-weight: normal;

    letter-spacing: 4px;
}

.price {

    margin-top: 15px;

    font-size: 24px;
}

.card p {

    max-width: 280px;

    margin-top: 20px;

    color: #aaa;

    line-height: 1.8;

    font-size: 14px;
}

.button {

    margin-top: 30px;

    padding: 13px 25px;

    border: 1px solid #777;

    color: white;

    text-decoration: none;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 3px;
}

.button:hover {

    background: white;

    color: black;
}


/* INTRODUCTION */

.introduction {

    min-height: 100vh;

    padding: 120px 25px;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;
}

.introduction-content {

    max-width: 800px;
}

.introduction h2 {

    font-size: 40px;

    font-weight: normal;

    letter-spacing: 4px;
}

.introduction p {

    margin-top: 35px;

    color: #bbb;

    font-size: 17px;

    line-height: 2;
}


/* MOBILE */

@media (max-width: 700px) {

    .cards {

        grid-template-columns: 1fr;

    }

    .cover h1 {

        letter-spacing: 7px;

    }

}

</style>

</head>


<body>

<nav>

← BACK

REFLECTRE

</a>

<section class="cover">

<img
src="Reflectre%20monochrome%20cover.png"
alt="REFLECTRE — Jeeva Samanera">

<div class="cover-overlay">

<h1>
REFLECTRE
</h1>

<p>
JEEVA SAMANERA
</p>

</div>

</section>


<!-- EDITIONS -->

<section class="editions" id="editions">

    <div class="edition-options">

        <a href="#introduction" class="edition-option">

            <span>ONLINE</span>

            <strong>€5.55</strong>

        </a>


        <a href="#" class="edition-option">

            <span>DOWNLOAD</span>

            <strong>COMING SOON</strong>

        </a>

    </div>

</section>


<!-- INTRODUCTION -->

class="introduction"
id="introduction">

<p>

<p>

Artwork 01 through Artwork 25,
each with its description.

</p>

</div>

</section>


</body>

</html>
