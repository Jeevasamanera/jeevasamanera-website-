<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>REFLECTRE — Jeeva Samanera</title>

    <meta name="description"
          content="REFLECTRE — A contemporary art series by Jeeva Samanera.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0d0d0d;
            color: #e8e4dc;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 30px;

            background: rgba(13, 13, 13, 0.88);
            backdrop-filter: blur(12px);

            z-index: 1000;
        }

        nav a {
            color: #e8e4dc;
            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: 11px;

            letter-spacing: 3px;
        }

        nav .nav-title {
            font-size: 14px;
            letter-spacing: 5px;
        }


        /* =========================
           COVER
        ========================= */

        .cover {
            height: 100vh;
            min-height: 650px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #000;
        }

        .cover img {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0.82;
        }

        .cover-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            justify-content: flex-end;
            align-items: center;

            padding-bottom: 70px;

            background:
                linear-gradient(
                    to bottom,
                    transparent 40%,
                    rgba(0,0,0,0.85)
                );
        }

        .cover-title {
            font-size: clamp(48px, 9vw, 110px);

            font-weight: normal;

            letter-spacing: 18px;

            margin-left: 18px;
        }

        .cover-artist {
            margin-top: 12px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 6px;
        }


        /* =========================
           EDITION SECTION
        ========================= */

        .edition {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 100px 25px;

            text-align: center;
        }

        .edition-intro {
            max-width: 650px;

            margin-bottom: 60px;
        }

        .edition-intro span {
            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 5px;

            opacity: 0.5;
        }

        .edition-intro h1 {
            margin-top: 20px;

            font-size: clamp(35px, 5vw, 60px);

            font-weight: normal;

            letter-spacing: 6px;
        }

        .edition-intro p {
            margin-top: 25px;

            color: #aaa59d;

            font-size: 16px;

            line-height: 1.9;
        }


        /* =========================
           EDITION CARDS
        ========================= */

        .edition-options {

            width: min(850px, 100%);

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;
        }

        .edition-card {

            min-height: 330px;

            border: 1px solid #353535;

            padding: 50px 35px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            transition: 0.4s ease;

            background: #111;
        }

        .edition-card:hover {

            border-color: #777;

            transform: translateY(-5px);

        }

        .edition-card .label {

            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 5px;

            opacity: 0.55;
        }

        .edition-card h2 {

            margin-top: 20px;

            font-size: 30px;

            font-weight: normal;

            letter-spacing: 4px;
        }

        .price {

            margin-top: 18px;

            font-size: 25px;
        }

        .edition-card p {

            max-width: 280px;

            margin-top: 20px;

            color: #aaa59d;

            font-size: 14px;

            line-height: 1.8;
        }


        /* =========================
           BUTTON
        ========================= */

        .edition-button {

            margin-top: 30px;

            padding: 14px 30px;

            border: 1px solid #777;

            color: #eee;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            transition: 0.3s;
        }

        .edition-button:hover {

            background: #eee;

            color: #111;

        }


        /* =========================
           INTRODUCTION
        ========================= */

        .introduction {

            min-height: 100vh;

            padding: 120px 25px;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .introduction-content {

            width: min(800px, 100%);

            text-align: center;
        }

        .small-title {

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 5px;

            opacity: 0.5;
        }

        .introduction h2 {

            margin-top: 25px;

            font-size: 45px;

            font-weight: normal;

            letter-spacing: 4px;
        }

        .introduction-text {

            margin-top: 45px;

            color: #c0bbb3;

            font-size: 17px;

            line-height: 2;
        }


        /* =========================
           ARTWORK
        ========================= */

            min-height: 100vh;

            padding: 100px 25px;

            display: flex;

            flex-direction: column;

            align-items: center;
